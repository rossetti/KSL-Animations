<!doctype html>
<!--
  PHASE 0 SPIKE — delete this whole directory once the question below is answered.

  THE QUESTION: does GitHub Pages serve a `.gz` file with `Content-Encoding: gzip`?

  If it does, fetch() transparently decompresses the body, and the player's own DecompressionStream then
  runs over already-plain text and fails. That would sink the plan's size argument, which rests on serving
  traces gzipped: all fifteen come to 3.5 MB compressed against 39.1 MB raw.

  Two players below, the same run through the same layout, differing only in which file they fetch. Whatever
  happens, the pair tells us what to do:

    both play        -> serve traces gzipped. Proceed as planned.
    only .atf plays  -> Pages is decompressing for us. Fall back to uncompressed traces (39 MB, still well
                        inside Pages' limits) or to an extension Pages does not treat as compressed.
    neither plays    -> something unrelated is wrong; the spike itself is at fault, not the question.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phase 0 spike — gzipped traces over GitHub Pages</title>
    <link rel="stylesheet" href="../assets/site.css">
    <style>
        .verdict { font-weight: 600; }
        .pass { color: #15803D; }
        .fail { color: #B91C1C; }
        .pending { color: var(--muted); }
        .player { height: 340px; border: 1px solid var(--line); border-radius: 6px; }
    </style>
</head>
<body>

<main class="wrap">
    <h1>Phase 0 spike</h1>
    <hr class="rule">
    <p class="lede">
        The same run, twice: once fetched gzipped, once fetched plain. If both animate, traces can ship
        compressed and the whole gallery costs about 4 MB.
    </p>

    <h2>1 — gzipped (<code>clinic.atf.gz</code>, 8.4 KB)</h2>
    <p class="verdict pending" id="v-gz">waiting…</p>
    <div class="player" id="p-gz"
         data-ksl-trace="clinic.atf.gz"
         data-ksl-layout="clinic.lay.json"></div>

    <h2>2 — uncompressed (<code>clinic.atf</code>, 102 KB)</h2>
    <p class="verdict pending" id="v-raw">waiting…</p>
    <div class="player" id="p-raw"
         data-ksl-trace="clinic.atf"
         data-ksl-layout="clinic.lay.json"></div>

    <h2>What the page decided</h2>
    <p class="verdict pending" id="v-all">waiting…</p>
</main>

<script src="../assets/ksl-animation.js"></script>
<script>
    // Ask the player what happened, rather than inspecting pixels. The first attempt at this counted
    // non-white canvas pixels and reported success over two outright failures: an untouched canvas is
    // transparent BLACK, so every pixel read as "not white". The player already writes a status line --
    // "<description> - N entities, ..." on success, "error: ..." on failure -- and its own account of
    // itself is both more accurate and more legible than anything inferred from the bitmap.
    function verdict(id) {
        var text = (document.getElementById(id).innerText || '').replace(/\s+/g, ' ').trim();
        if (/error:/i.test(text)) return { ok: false, why: text.slice(text.search(/error:/i), 200) };
        if (/loading|waiting/i.test(text) || text === '') return { ok: false, why: 'never finished loading' };
        return { ok: true, why: text.slice(-90) };
    }

    function say(id, v, label) {
        var el = document.getElementById(id);
        el.textContent = (v.ok ? '\u2713 ' + label + ' - ' : '\u2717 ') + v.why;
        el.className = 'verdict ' + (v.ok ? 'pass' : 'fail');
    }

    setTimeout(function () {
        var gz = verdict('p-gz'), raw = verdict('p-raw');
        say('v-gz', gz, 'played, so the browser decompressed it');
        say('v-raw', raw, 'played');

        var el = document.getElementById('v-all'), cls = 'verdict ', msg;
        if (gz.ok && raw.ok)  { cls += 'pass'; msg = '\u2713 Serve traces gzipped. Proceed as planned - the gallery costs about 4 MB.'; }
        else if (raw.ok)      { cls += 'fail'; msg = '\u2717 Pages is decompressing .gz for us. Fall back to uncompressed traces (39 MB) or a different extension.'; }
        else                  { cls += 'fail'; msg = '\u2717 Neither played, so this says nothing about Pages - the spike itself is at fault.'; }
        el.textContent = msg;
        el.className = cls;
    }, 4000);
</script>

</body>
</html>
